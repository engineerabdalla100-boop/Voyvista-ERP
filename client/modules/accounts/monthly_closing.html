<style>
  body { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; }
  .closing-picker { display: flex; gap: 14px; align-items: flex-end; margin-bottom: 24px; flex-wrap: wrap; }
  .closing-picker .vv-field { display: flex; flex-direction: column; gap: 5px; }
  .closing-picker .vv-field label { font-size: 12px; font-weight: 700; color: var(--text-soft); }
  .closing-picker select, .closing-picker input { padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12.5px; background: var(--surface); color: var(--text); font-family: inherit; }

  .kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 24px; }
  .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 16px 18px; }
  .kpi-card__label { font-size: 11px; color: var(--text-soft); margin-bottom: 6px; }
  .kpi-card__value { font-weight: 800; font-size: 18px; color: var(--text); }
  .kpi-card__value.is-positive { color: var(--emerald); }
  .kpi-card__value.is-negative { color: var(--coral); }
  .kpi-card__delta { font-size: 11px; margin-top: 4px; }
  .kpi-card__delta.up { color: var(--emerald); }
  .kpi-card__delta.down { color: var(--coral); }

  .readiness-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px 20px; margin-bottom: 24px; }
  .readiness-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
  .readiness-row:last-child { border-bottom: none; }
  .readiness-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
  .readiness-badge--ok { background: var(--emerald-soft); color: var(--emerald); }
  .readiness-badge--blocked { background: #FBE2E2; color: #B02A2A; }

  .btn-export { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 8px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text-soft); cursor: pointer; }
  .btn-export svg { width: 14px; height: 14px; }

  .archive-section { margin-top: 30px; }
  .ledger-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); }
  table.ledger { width: 100%; border-collapse: collapse; min-width: 800px; font-size: 12px; }
  .ledger thead th { text-align: right; font-size: 10.5px; color: var(--text-faint); font-weight: 700; padding: 9px 10px; border-bottom: 1px solid var(--border); background: var(--canvas); white-space: nowrap; }
  .ledger tbody td { padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .ledger .num { text-align: left; font-variant-numeric: tabular-nums; }
  .ledger tbody tr { cursor: pointer; }
  .ledger tbody tr:hover { background: var(--canvas); }

  .status-badge { font-size: 10.5px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
  .status-badge--locked { background: var(--emerald-soft); color: var(--emerald); }
  .status-badge--open { background: #FBEAC8; color: #A6700F; }

  .empty-state { text-align: center; padding: 30px 20px; color: var(--text-faint); font-size: 12.5px; }
</style>
</head>
