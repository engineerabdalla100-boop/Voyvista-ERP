<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expenses & Custody | Voyvista ERP</title>
<script src="/client/assets/js/config.js"></script>
<script src="/client/assets/js/api_client.js"></script>
<script src="/client/assets/js/auth.js"></script>
<script src="/client/assets/js/components.js"></script>
<script src="/client/assets/js/router.js"></script>
<link rel="stylesheet" href="/client/assets/css/style.css" />
<style>
  .vv-modal-overlay { position: fixed; inset: 0; background: rgba(15, 26, 48, 0.4); z-index: 80; display: none; align-items: flex-start; justify-content: center; padding: 30px 15px; overflow-y: auto; }
  .vv-modal-overlay.is-open { display: flex; }
  .vv-modal { background: var(--surface); border-radius: var(--radius-lg); width: 100%; max-width: 680px; box-shadow: var(--shadow-lg); overflow: hidden; }
  .vv-modal__header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .vv-modal__title { font-family: var(--font-display); font-weight: 700; font-size: 15.5px; display: flex; align-items: center; gap: 9px; }
  .vv-modal__title svg { width: 17px; height: 17px; color: var(--gold-deep); }
  .vv-modal__close { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-soft); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .vv-modal__close svg { width: 14px; height: 14px; }
  .vv-modal__body { padding: 20px; max-height: 80vh; overflow-y: auto; }
  .vv-modal__footer { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); background: var(--canvas); }

  .vv-field-row { display: flex; gap: 14px; margin-bottom: 14px; }
  .vv-field { flex: 1; display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .vv-field-row .vv-field { margin-bottom: 0; }
  .vv-field label { font-size: 12px; font-weight: 700; color: var(--text-soft); }
  .vv-field input, .vv-field select, .vv-field textarea { padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12.5px; background: var(--surface); color: var(--text); font-family: inherit; }

  .ledger-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); }
  table.ledger { width: 100%; border-collapse: collapse; min-width: 1000px; font-size: 12px; }
  .ledger thead th { text-align: left; font-size: 10.5px; color: var(--text-faint); font-weight: 700; text-transform: uppercase; padding: 9px 10px; border-bottom: 1px solid var(--border); background: var(--canvas); white-space: nowrap; }
  .ledger tbody td { padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .ledger .num { text-align: right; font-variant-numeric: tabular-nums; }

  .status-badge { font-size: 10.5px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
  .status-badge--draft { background: #EEF0F4; color: #5C6B82; }
  .status-badge--submitted { background: var(--amber-soft, #FBEAC8); color: var(--amber, #A6700F); }
  .status-badge--approved { background: #E7EEFD; color: #3068E0; }
  .status-badge--posted { background: var(--emerald-soft); color: var(--emerald); }
  .status-badge--settled { background: var(--emerald-soft); color: var(--emerald); }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .ledger-search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 12px; width: 280px; }
  .ledger-search svg { width: 15px; height: 15px; color: var(--text-faint); flex-shrink: 0; }
  .ledger-search input { border: none; outline: none; font-size: 12.5px; width: 100%; background: transparent; color: var(--text); }

  .row-action-btn { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text-soft); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; margin-inline-start: 4px; }
  .row-action-btn.is-danger { color: #B02A2A; border-color: #F2C4C4; }
  .row-action-btn svg { width: 13px; height: 13px; }

  .btn-workflow-next { font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--gold); background: var(--gold-soft); color: var(--gold-deep); cursor: pointer; margin-inline-end: 4px; }

  .section-title { display: flex; align-items: center; justify-content: space-between; margin: 34px 0 16px; }
  .section-title h2 { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--text); }

  .empty-state { text-align: center; padding: 30px 20px; color: var(--text-faint); font-size: 12.5px; }
</style>
</head>
<body>

<div class="app-shell">
  <div id="app-sidebar"></div>

  <div class="main">
    <div id="app-topbar"></div>

    <div class="content">
      <div class="page-head">
        <div>
          <h1>Expenses & Custody</h1>
          <p style="font-size:12.5px; color:var(--text-soft); margin-top:4px;">Company expenses and employee cash advances</p>
        </div>
      </div>

      <!-- ============================= EXPENSES ============================= -->
      <div class="toolbar">
        <div class="ledger-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="expense-search" placeholder="Search by category or description..." />
        </div>
        <button class="btn btn--primary" id="btn-open-add-expense" type="button">+ Add Expense</button>
      </div>

      <div class="ledger-scroll">
        <table class="ledger" id="expenses-table">
          <thead>
            <tr><th>Date</th><th>Category</th><th>Description</th><th class="num">Amount</th><th>Payment Method</th><th>Invoice #</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="expenses-table-body"></tbody>
        </table>
      </div>
      <div class="empty-state" id="expenses-empty" style="display:none;"><p>No expenses recorded yet.</p></div>

      <!-- ============================= CUSTODY ============================= -->
      <div class="section-title">
        <h2>Employee Custody</h2>
        <button class="btn btn--primary" id="btn-open-add-custody" type="button">+ Issue Custody</button>
      </div>

      <div class="toolbar">
        <div class="ledger-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="custody-search" placeholder="Search by employee..." />
        </div>
      </div>

      <div class="ledger-scroll">
        <table class="ledger" id="custody-table">
          <thead>
            <tr><th>Number</th><th>Date</th><th>Employee</th><th class="num">Amount</th><th class="num">Spent</th><th class="num">Remaining</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="custody-table-body"></tbody>
        </table>
      </div>
      <div class="empty-state" id="custody-empty" style="display:none;"><p>No custody records yet.</p></div>

    </div>
  </div>
</div>

<!-- ============================= ADD EXPENSE MODAL ============================= -->
<div class="vv-modal-overlay" id="modal-add-expense">
  <div class="vv-modal">
    <div class="vv-modal__header">
      <div class="vv-modal__title">Add Expense</div>
      <button class="vv-modal__close" data-close-modal="modal-add-expense" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="vv-modal__body">
      <div class="vv-field-row">
        <div class="vv-field"><label>Date</label><input type="date" id="ex-date" /></div>
        <div class="vv-field"><label>Category</label><input type="text" id="ex-category" placeholder="e.g. Rent, Utilities..." /></div>
      </div>
      <div class="vv-field-row">
        <div class="vv-field"><label>Amount</label><input type="number" min="0" step="0.01" id="ex-amount" value="0" /></div>
        <div class="vv-field"><label>Invoice / Document Number</label><input type="text" id="ex-invoice-number" placeholder="Optional" /></div>
      </div>
      <div class="vv-field-row">
        <div class="vv-field">
          <label>Payment Method</label>
          <select id="ex-payment-method">
            <option value="cash">Cash</option>
            <option value="bank">Bank</option>
            <option value="custody">Custody</option>
          </select>
        </div>
        <div class="vv-field" id="ex-treasury-field"><label>Treasury Account</label><select id="ex-treasury-account"></select></div>
        <div class="vv-field" id="ex-custody-field" style="display:none;"><label>Employee Custody</label><select id="ex-custody"></select></div>
      </div>
      <div class="vv-field"><label>Expense Account (Chart of Accounts)</label><select id="ex-expense-account"></select></div>
      <div class="vv-field"><label>Description</label><input type="text" id="ex-description" placeholder="What was this expense for..." /></div>
    </div>
    <div class="vv-modal__footer">
      <button class="btn btn--ghost" data-close-modal="modal-add-expense" type="button">Cancel</button>
      <button class="btn btn--primary" id="btn-save-expense" type="button">Save Expense (Draft)</button>
    </div>
  </div>
</div>

<!-- ============================= ADD CUSTODY MODAL ============================= -->
<div class="vv-modal-overlay" id="modal-add-custody">
  <div class="vv-modal">
    <div class="vv-modal__header">
      <div class="vv-modal__title">Issue Custody</div>
      <button class="vv-modal__close" data-close-modal="modal-add-custody" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="vv-modal__body">
      <div class="vv-field-row">
        <div class="vv-field"><label>Date</label><input type="date" id="cu-date" /></div>
        <div class="vv-field"><label>Employee</label><select id="cu-employee"></select></div>
      </div>
      <div class="vv-field-row">
        <div class="vv-field"><label>Amount</label><input type="number" min="0" step="0.01" id="cu-amount" value="0" /></div>
        <div class="vv-field"><label>Treasury Account (Source)</label><select id="cu-treasury-account"></select></div>
      </div>
      <div class="vv-field"><label>Custody Account (Chart of Accounts)</label><select id="cu-custody-account"></select></div>
      <div class="vv-field"><label>Description</label><input type="text" id="cu-description" placeholder="Purpose of the advance..." /></div>
    </div>
    <div class="vv-modal__footer">
      <button class="btn btn--ghost" data-close-modal="modal-add-custody" type="button">Cancel</button>
      <button class="btn btn--primary" id="btn-save-custody" type="button">Save Custody (Draft)</button>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    VVComponents.mount({ page: "acc_expenses", title: "Expenses & Custody" });
  });
</script>
<script src="/client/modules/accounts/expenses.js"></script>
</body>
</html>
