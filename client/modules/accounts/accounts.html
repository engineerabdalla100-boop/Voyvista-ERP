<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>قسم الحسابات - لوحة التحكم | Voyvista ERP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" />

<!-- ============================================================
     Shared app assets — same set every other page in this project
     loads (flights.html, hotels.html, visas.html, owner.html).
     ============================================================ -->
<script src="/client/assets/js/config.js"></script>
<script src="/client/assets/js/auth.js"></script>
<script src="/client/assets/js/components.js"></script>
<script src="/client/assets/js/router.js"></script>

<!-- ============================================================
     Accounting module scripts — load order matters:
       1) accounts_core.js   — must load first (switchAccountView,
          VVWorkflow, VVAccountsCore — every module below depends on it)
       2) permissions.js — central Role→Permission map (VVPermissions).
          Must load before change_requests.js and manager_override.js —
          both call into it.
       3) change_requests.js — Maker-Checker approval engine (Contract:
          { success, reason }); every financial module below registers
          its own Apply Handler with it.
       3) party_core.js — Party↔Account linking, depends on
          change_requests.js above.
       4-10) chart_of_accounts.js / customer_ledger.js / treasury.js /
          custody.js / expenses.js / vouchers.js / journal_entries.js —
          each registers itself into VVAccountsModules and self-wires its
          own Quick Action button. custody.js / expenses.js / vouchers.js
          / journal_entries.js all route their financial mutations
          through change_requests.js's Apply Handler pattern (Intent
          Marker + validate-before-write) — none of them mutate Treasury/
          party ledgers directly from a UI button anymore.
       11) manager_override.js — provides window.ManagerOverride, the
          passcode gate change_requests.js calls internally on Approve.
     ============================================================ -->
<script src="/client/modules/accounts/accounts_core.js"></script>
<script src="/client/modules/accounts/permissions.js"></script>
<script src="/client/modules/accounts/change_requests.js"></script>
<script src="/client/modules/accounts/party_core.js"></script>
<script src="/client/modules/accounts/chart_of_accounts.js"></script>
<script src="/client/modules/accounts/customer_ledger.js"></script>
<script src="/client/modules/accounts/treasury.js"></script>
<script src="/client/modules/accounts/custody.js"></script>
<script src="/client/modules/accounts/expenses.js"></script>
<script src="/client/modules/accounts/vouchers.js"></script>
<script src="/client/modules/accounts/journal_entries.js"></script>
<script src="/client/modules/accounts/manager_override.js"></script>

<link rel="stylesheet" href="/client/assets/css/style.css" />
<style>
  body { font-family: 'Cairo', var(--font-body); }

  .acc-header { margin-bottom: 26px; }
  .acc-header h1 { font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 22px; }
  .acc-header p { font-size: 13px; color: var(--text-soft); margin-top: 5px; }

  .quick-actions-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .quick-action-btn {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
    padding: 18px 14px; text-align: center; cursor: pointer; transition: all .15s ease;
  }
  .quick-action-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--gold); }
  .quick-action-btn__icon { width: 42px; height: 42px; border-radius: 11px; background: var(--qa-bg, var(--gold-soft)); color: var(--qa-fg, var(--gold-deep)); display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
  .quick-action-btn__icon svg { width: 19px; height: 19px; }
  .quick-action-btn__label { font-size: 12.5px; font-weight: 700; color: var(--text); }

  .module-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .module-toolbar__title { font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 18px; color: var(--text); }
  .module-back-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 16px; font-size: 13px; font-weight: 700; color: var(--text); cursor: pointer; font-family: 'Cairo', sans-serif; }
  .module-back-btn:hover { border-color: var(--gold); }
  .module-back-btn svg { width: 15px; height: 15px; }

  .table-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .search-wrap { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 12px; }
  .search-wrap svg { width: 14px; height: 14px; color: var(--text-faint); flex-shrink: 0; }
  .search-wrap input { border: none; outline: none; width: 100%; background: transparent; font-size: 12.5px; font-family: 'Cairo', sans-serif; }

  .ledger-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); }
  table.acc-table { width: 100%; border-collapse: collapse; min-width: 700px; font-size: 13px; }
  .acc-table thead th { text-align: right; font-size: 11px; color: var(--text-faint); font-weight: 700; padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--canvas); white-space: nowrap; }
  .acc-table tbody td { padding: 12px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .acc-table tbody tr:last-child td { border-bottom: none; }
  .acc-table .num { font-variant-numeric: tabular-nums; font-weight: 600; }
  .amount-in { color: var(--emerald); }
  .amount-out { color: var(--coral); }
  .cell-primary { font-weight: 700; color: var(--text); }

  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge--posted { background: var(--emerald-soft); color: var(--emerald); }
  .badge--pending { background: var(--amber-soft); color: var(--amber); }

  .row-actions { display: flex; align-items: center; gap: 8px; }
  .row-action-btn { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-soft); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .row-action-btn.is-danger { color: var(--coral); }
  .row-action-btn svg { width: 12px; height: 12px; }
  .btn-workflow-next {
    background: var(--gold-soft); color: var(--gold-deep); border: 1px solid var(--gold);
    font-family: 'Cairo', sans-serif; font-size: 11.5px; font-weight: 700; padding: 6px 12px;
    border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap;
  }
  .btn-workflow-next:hover { background: var(--gold); color: #fff; }

  .vv-field { margin-bottom: 14px; }
  .vv-field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--text-soft); margin-bottom: 6px; }
  .vv-field input, .vv-field select, .vv-field textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 13px; color: var(--text); background: var(--surface); font-family: 'Cairo', sans-serif;
  }
  .vv-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .vv-tabs { display: flex; gap: 4px; background: var(--canvas); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px; width: fit-content; }
  .vv-tab { padding: 7px 16px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--text-soft); cursor: pointer; }
  .vv-tab.is-active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

  .coa-tree { display: flex; flex-direction: column; gap: 6px; }
  .coa-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12.5px; }
  .coa-row__name { font-weight: 700; }
  .coa-row__code { font-family: var(--font-mono); color: var(--text-faint); font-size: 11px; margin-inline-start: 8px; }
  .coa-type-chip { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px; }
  .report-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 18px; }
  .section-title { display: flex; align-items: center; justify-content: space-between; margin: 30px 0 16px; }
  .section-title h2 { font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 15.5px; color: var(--text); }
  .report-panel h4 { font-family: 'Cairo', sans-serif; font-size: 13.5px; margin-bottom: 12px; }
  .report-row { display: flex; justify-content: space-between; padding: 8px 2px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .report-row:last-child { border-bottom: none; }

  .ledger-list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; }
  .ledger-list-item__name { font-size: 13px; font-weight: 700; }
  .ledger-list-item__meta { font-size: 11px; color: var(--text-faint); margin-top: 2px; }

  .vv-modal-overlay { position: fixed; inset: 0; background: rgba(15, 26, 48, 0.4); z-index: 80; display: none; align-items: flex-start; justify-content: center; padding: 30px 15px; overflow-y: auto; }
  .vv-modal-overlay.is-open { display: flex; }
  .vv-modal { background: var(--surface); border-radius: var(--radius-lg); width: 100%; max-width: 620px; box-shadow: var(--shadow-lg); overflow: hidden; font-family: 'Cairo', sans-serif; }
  .vv-modal__header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .vv-modal__title { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 9px; }
  .vv-modal__title svg { width: 17px; height: 17px; color: var(--gold-deep); }
  .vv-modal__close { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-soft); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .vv-modal__close svg { width: 14px; height: 14px; }
  .vv-modal__body { padding: 20px; max-height: 70vh; overflow-y: auto; }
  .vv-modal__footer { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); background: var(--canvas); }

  .btn { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; border-radius: var(--radius-sm); padding: 9px 16px; border: 1px solid transparent; font-family: 'Cairo', sans-serif; cursor: pointer; }
  .btn--primary { background: var(--gold); color: var(--ink); }
  .btn--ghost { background: var(--surface); color: var(--text-soft); border-color: var(--border); }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-faint); }
  .empty-state svg { width: 40px; height: 40px; margin-bottom: 10px; opacity: .5; }
  .empty-state p { font-size: 13px; }

  @media (max-width: 1200px) { .quick-actions-grid { grid-template-columns: repeat(2, 1fr); } }

  /* ============================================================
     Pending EGP collections posting panel — treasury.js
     ============================================================ */
  .egp-collections-panel { background: var(--surface); border: 1px solid var(--gold); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
  .egp-collections-panel__header { background: var(--gold-soft); padding: 12px 16px; font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 13.5px; color: var(--gold-deep); }
  #egp-post-target { font-size: 12px; padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); }

  /* ============================================================
     "طلباتي المعلّقة" panel + "عرض التفاصيل" modal — accounts.html
     own inline script, reads window.VVChangeRequests directly.
     ============================================================ */
  .my-requests-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
  .my-request-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .my-request-row:last-child { border-bottom: none; }
  .my-request-row__label { font-weight: 700; color: var(--text); }
  .my-request-row__meta { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .my-request-status { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .my-request-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
  .my-request-badge--pending { background: var(--amber-soft); color: var(--amber); }
  .my-request-badge--approved { background: var(--emerald-soft); color: var(--emerald); }
  .my-request-badge--rejected { background: var(--coral-soft); color: var(--coral); }
  .my-request-badge--apply_failed { background: var(--coral-soft); color: var(--coral); }
  .my-request-details-btn { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-soft); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .my-request-details-btn svg { width: 12px; height: 12px; }

  .audit-detail-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .audit-detail-row:last-child { border-bottom: none; }
  .audit-detail-row__label { color: var(--text-soft); font-weight: 600; flex-shrink: 0; }
  .audit-detail-row__value { color: var(--text); font-weight: 700; text-align: left; }
  .audit-diff-line { font-size: 11.5px; margin-bottom: 4px; }
</style>
</head>
<body>

<div class="app-shell">
  <div id="app-sidebar"></div>

  <div class="main">
    <div id="app-topbar"></div>

    <div class="content">

      <!-- ============================================================
           Dashboard — Quick Actions only. No fake/unpowered KPI cards:
           there's no accounting-engine.js in this project to feed real
           numbers into them, so none are shown rather than showing
           numbers that don't mean anything.
           ============================================================ -->
      <div id="dashboard-main-view">
        <div class="acc-header">
          <h1>قسم الحسابات - لوحة التحكم</h1>
          <p>اختر أحد الأقسام أدناه للبدء</p>
        </div>

        <div class="quick-actions-grid">
          <button class="quick-action-btn" id="qa-journal" data-view="journal" style="--qa-bg:#E7EEFD;--qa-fg:#3068E0;">
            <div class="quick-action-btn__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
            <div class="quick-action-btn__label">قيد يومي</div>
          </button>

          <button class="quick-action-btn" id="qa-receipt" data-view="receipt" style="--qa-bg:#DCFCE7;--qa-fg:#1E9D6E;">
            <div class="quick-action-btn__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
            <div class="quick-action-btn__label">سند قبض</div>
          </button>

          <button class="quick-action-btn" id="qa-payment" data-view="payment" style="--qa-bg:#FCE7E7;--qa-fg:#D14848;">
            <div class="quick-action-btn__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22V2M7 19h9.5a3.5 3.5 0 0 0 0-7h-5a3.5 3.5 0 0 1 0-7H18"/></svg></div>
            <div class="quick-action-btn__label">سند صرف</div>
          </button>

          <button class="quick-action-btn" id="qa-expenses" data-view="expenses" style="--qa-bg:#FBEFDA;--qa-fg:#C98A1E;">
            <div class="quick-action-btn__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg></div>
            <div class="quick-action-btn__label">مصروفات</div>
          </button>

          <button class="quick-action-btn" id="qa-treasury" data-view="treasury" style="--qa-bg:#E0F2FE;--qa-fg:#2478D9;">
            <div class="quick-action-btn__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg></div>
            <div class="quick-action-btn__label">الخزينة والبنوك</div>
          </button>

          <button class="quick-action-btn" id="qa-custody" data-view="custody" style="--qa-bg:#EDE9FE;--qa-fg:#7C5CE0;">
            <div class="quick-action-btn__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg></div>
            <div class="quick-action-btn__label">العهد</div>
          </button>

          <button class="quick-action-btn" id="qa-coa" data-view="chartOfAccounts" style="--qa-bg:#F5EBD3;--qa-fg:#8C6A22;">
            <div class="quick-action-btn__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg></div>
            <div class="quick-action-btn__label">شجرة الحسابات</div>
          </button>

          <button class="quick-action-btn" id="qa-parties" data-view="parties" style="--qa-bg:#FDECD8;--qa-fg:#C2701A;">
            <div class="quick-action-btn__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M15 20a4.5 4.5 0 0 1 8 0"/></svg></div>
            <div class="quick-action-btn__label">العملاء والموردين</div>
          </button>

          <a class="quick-action-btn" id="link-general-sales-report" href="/client/modules/master_data/data.html?open=accounting" style="--qa-bg:#F5EBD3;--qa-fg:#8C6A22; text-decoration:none; display:block;">
            <div class="quick-action-btn__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg></div>
            <div class="quick-action-btn__label">تقرير المبيعات العام (قسم البيانات)</div>
          </a>
        </div>
      </div>

      <!-- ============================================================
           Full-width module view — populated dynamically by
           accounts_core.js's switchAccountView(). Starts empty/hidden.
           ============================================================ -->
      <div id="module-detail-view" style="display:none;"></div>

    </div>
  </div>
</div>

<!-- ============================================================
     "عرض التفاصيل" — generic Audit Trail modal. Reads a single
     Change Request by id and renders exactly what it knows: who
     requested it, who reviewed it, when, and the field-level diff
     (or failure/rejection reason). No new data anywhere — everything
     here already exists on the vv_change_requests record itself.
     ============================================================ -->
<div class="vv-modal-overlay" id="modal-audit-details">
  <div class="vv-modal" style="max-width:520px;">
    <div class="vv-modal__header">
      <div class="vv-modal__title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2.5 2.5"/></svg>
        تفاصيل العملية
      </div>
      <button class="vv-modal__close" data-close-modal="modal-audit-details" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="vv-modal__body" id="audit-details-body"></div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (typeof VVComponents !== 'undefined') {
      VVComponents.mount({ page: "accounts", title: "قسم الحسابات" });
    }
  });
</script>

<!-- ============================================================
     "طلباتي المعلّقة" — lists Change Requests submitted by the
     CURRENT user (any status), newest first, with a details button.
     Reads window.VVChangeRequests directly — no new API, no new
     storage, no change to any module's contracts. Inserted right
     before accounts_core.js's own "آخر العمليات" panel, matching the
     agreed dashboard layout.
     ============================================================ -->
<script>
(function () {
  "use strict";

  const REQUEST_TYPE_LABELS = {
    chart_of_accounts: "حساب محاسبي", party: "جهة (Party)", journal_entries: "قيد يومي",
    vouchers: "سند", custody: "عهدة", expenses: "مصروف", treasury: "عملية خزينة",
  };
  const CHANGE_TYPE_LABELS = {
    create: "إضافة", edit: "تعديل", link: "ربط", unlink: "إلغاء ربط",
    post: "ترحيل", reverse: "عكس", issue: "صرف", settle: "تسوية", cancel: "إلغاء", financial_op: "عملية مالية",
  };
  const STATUS_LABELS = { pending: "بانتظار الاعتماد", approved: "معتمد", rejected: "مرفوض", apply_failed: "تعذّر التطبيق" };

  function currentUserName() {
    if (window.VVAuth && typeof window.VVAuth.getCurrentUser === "function") {
      const u = window.VVAuth.getCurrentUser();
      if (u && u.full_name) return u.full_name;
    }
    return "Demo User";
  }

  function ensureMyRequestsPanelExists() {
    if (document.getElementById("my-requests-panel-wrap")) return;
    const dashboard = document.getElementById("dashboard-main-view");
    if (!dashboard) return;

    const wrap = document.createElement("div");
    wrap.id = "my-requests-panel-wrap";
    wrap.innerHTML = `
      <div class="section-title">
        <h2>🔔 طلباتي المعلّقة</h2>
      </div>
      <div class="my-requests-panel" id="my-requests-panel"></div>
    `;
    // Inserted BEFORE accounts_core.js's own dynamically-created "آخر
    // العمليات" panel if it already exists (it loads/runs first since
    // its script tag comes before this one) — otherwise just appended,
    // and accounts_core.js's own appendChild() will naturally land after.
    const existingActivityPanel = document.getElementById("dashboard-recent-activity");
    if (existingActivityPanel) {
      dashboard.insertBefore(wrap, existingActivityPanel);
    } else {
      dashboard.appendChild(wrap);
    }
  }

  function renderMyRequestsPanel() {
    if (!window.VVChangeRequests) return;
    ensureMyRequestsPanelExists();

    const me = currentUserName();
    const mine = window.VVChangeRequests.getAll()
      .filter((r) => r.requestedBy === me)
      .sort((a, b) => (b.id > a.id ? 1 : -1))
      .slice(0, 8);

    const panel = document.getElementById("my-requests-panel");
    if (!panel) return;

    if (mine.length === 0) {
      panel.innerHTML = `<div class="empty-state" style="padding:24px;"><p>لا توجد طلبات مُرسلة منك بعد</p></div>`;
      return;
    }

    panel.innerHTML = mine.map((r) => {
      const moduleLabel = REQUEST_TYPE_LABELS[r.module] || r.module;
      const typeLabel = CHANGE_TYPE_LABELS[r.changeType] || r.changeType;
      return `
        <div class="my-request-row">
          <div>
            <div class="my-request-row__label">${typeLabel} ${moduleLabel} — ${r.targetLabel}</div>
            <div class="my-request-row__meta">${r.requestedAt}</div>
          </div>
          <div class="my-request-status">
            <span class="my-request-badge my-request-badge--${r.status}">${STATUS_LABELS[r.status] || r.status}</span>
            <button class="my-request-details-btn" data-show-details="${r.id}" title="عرض التفاصيل">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>`;
    }).join("");

    panel.querySelectorAll("[data-show-details]").forEach((btn) => {
      btn.addEventListener("click", () => showAuditDetails(btn.dataset.showDetails));
    });
  }

  // =========================================================================
  // "عرض التفاصيل" modal — generic renderer for any single Change Request.
  // =========================================================================

  function showAuditDetails(requestId) {
    const r = window.VVChangeRequests.getAll().find((req) => req.id === requestId);
    const body = document.getElementById("audit-details-body");
    if (!r || !body) return;

    const moduleLabel = REQUEST_TYPE_LABELS[r.module] || r.module;
    const typeLabel = CHANGE_TYPE_LABELS[r.changeType] || r.changeType;

    let rows = `
      <div class="audit-detail-row"><span class="audit-detail-row__label">نوع العملية</span><span class="audit-detail-row__value">${typeLabel} ${moduleLabel}</span></div>
      <div class="audit-detail-row"><span class="audit-detail-row__label">العنصر</span><span class="audit-detail-row__value">${r.targetLabel}</span></div>
      <div class="audit-detail-row"><span class="audit-detail-row__label">الحالة</span><span class="audit-detail-row__value"><span class="my-request-badge my-request-badge--${r.status}">${STATUS_LABELS[r.status] || r.status}</span></span></div>
      <div class="audit-detail-row"><span class="audit-detail-row__label">أنشأ الطلب</span><span class="audit-detail-row__value">${r.requestedBy}</span></div>
      <div class="audit-detail-row"><span class="audit-detail-row__label">تاريخ الإنشاء</span><span class="audit-detail-row__value">${r.requestedAt}</span></div>
    `;

    if (r.reviewedBy) {
      rows += `
        <div class="audit-detail-row"><span class="audit-detail-row__label">راجع الطلب</span><span class="audit-detail-row__value">${r.reviewedBy}</span></div>
        <div class="audit-detail-row"><span class="audit-detail-row__label">تاريخ المراجعة</span><span class="audit-detail-row__value">${r.reviewedAt || "—"}</span></div>
      `;
    }

    if (r.status === "rejected" && r.rejectionReason) {
      rows += `<div class="audit-detail-row"><span class="audit-detail-row__label">سبب الرفض</span><span class="audit-detail-row__value" style="color:var(--coral);">${r.rejectionReason}</span></div>`;
    }
    if (r.status === "apply_failed" && r.applyFailureReason) {
      rows += `<div class="audit-detail-row"><span class="audit-detail-row__label">سبب تعذّر التطبيق</span><span class="audit-detail-row__value" style="color:var(--coral);">${r.applyFailureReason}</span></div>`;
    }

    if (r.fieldChanges && r.fieldChanges.length > 0) {
      rows += `<div class="audit-detail-row" style="flex-direction:column; align-items:stretch;"><span class="audit-detail-row__label" style="margin-bottom:8px;">التغييرات</span>${
        r.fieldChanges.map((c) => `<div class="audit-diff-line"><strong>${c.field}:</strong> <span style="color:var(--coral);">${c.oldValue ?? "—"}</span> ➜ <span style="color:var(--emerald);">${c.newValue ?? "—"}</span></div>`).join("")
      }</div>`;
    } else if (r.changeType === "create" || r.changeType === "issue") {
      rows += `<div class="audit-detail-row"><span class="audit-detail-row__label">الأثر المالي</span><span class="audit-detail-row__value" style="color:var(--emerald);">إنشاء جديد بالكامل</span></div>`;
    }

    body.innerHTML = rows;
    document.getElementById("modal-audit-details").classList.add("is-open");
  }

  document.querySelectorAll("[data-close-modal]").forEach((btn) => {
    btn.addEventListener("click", () => document.getElementById(btn.dataset.closeModal)?.classList.remove("is-open"));
  });
  document.querySelectorAll(".vv-modal-overlay").forEach((overlay) => {
    overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.remove("is-open"); });
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") document.querySelectorAll(".vv-modal-overlay.is-open").forEach((o) => o.classList.remove("is-open"));
  });

  document.addEventListener("DOMContentLoaded", renderMyRequestsPanel);
  // Refresh whenever the user returns to the dashboard from any module —
  // backToDashboard() already calls window.refreshAccountsDashboard() if
  // present (accounts_core.js's own hook); piggy-back on the same name
  // rather than inventing a second one, so both panels stay in sync.
  const existingRefreshHook = window.refreshAccountsDashboard;
  window.refreshAccountsDashboard = function () {
    if (typeof existingRefreshHook === "function") existingRefreshHook();
    renderMyRequestsPanel();
  };
})();
</script>
</body>
</html>
