<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data | Voyvista ERP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="/client/assets/js/config.js"></script>
<script src="/client/assets/js/api_client.js"></script>
<script src="/client/assets/js/auth.js"></script>
<script src="/client/assets/js/components.js"></script>
<script src="/client/assets/js/router.js"></script>
<link rel="stylesheet" href="/client/assets/css/style.css" />
<style>
  .package-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 900px; margin: 40px auto 0; }
  .package-card {
    background: var(--surface); border: none; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
    padding: 30px 26px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; text-align: left;
    cursor: pointer; transition: transform .18s ease, box-shadow .18s ease; position: relative; overflow: hidden;
  }
  .package-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .package-card::after { content: ''; position: absolute; top: 0; right: 0; left: 0; height: 3px; background: var(--pkg-accent, var(--gold)); }
  .package-card__icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: var(--pkg-accent-soft, var(--gold-soft)); color: var(--pkg-accent, var(--gold-deep)); }
  .package-card__icon svg { width: 25px; height: 25px; }
  .package-card__title { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--text); }
  .package-card__desc { font-size: 12.5px; color: var(--text-soft); line-height: 1.7; }
  .package-card--b2b { --pkg-accent: #3068E0; --pkg-accent-soft: #E7EEFD; }
  .package-card--b2c { --pkg-accent: #1F9D6E; --pkg-accent-soft: #DCFCE7; }
  .package-card--accounting { --pkg-accent: #C79A3B; --pkg-accent-soft: #F5EBD3; }

  .module-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .module-toolbar__title { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--text); }
  .module-back-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 16px; font-size: 13px; font-weight: 700; color: var(--text); cursor: pointer; }
  .module-back-btn:hover { border-color: var(--gold); }
  .module-back-btn svg { width: 15px; height: 15px; }

  .vv-modal-overlay { position: fixed; inset: 0; background: rgba(15, 26, 48, 0.4); z-index: 80; display: none; align-items: flex-start; justify-content: center; padding: 30px 15px; overflow-y: auto; }
  .vv-modal-overlay.is-open { display: flex; }
  .vv-modal { background: var(--surface); border-radius: var(--radius-lg); width: 100%; max-width: 640px; box-shadow: var(--shadow-lg); overflow: hidden; }
  .vv-modal__header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .vv-modal__title { font-family: var(--font-display); font-weight: 700; font-size: 15.5px; }
  .vv-modal__close { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-soft); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .vv-modal__close svg { width: 14px; height: 14px; }
  .vv-modal__body { padding: 20px; }
  .vv-modal__footer { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); background: var(--canvas); }
  .vv-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .vv-field label { font-size: 12px; font-weight: 700; color: var(--text-soft); }
  .vv-field input, .vv-field select { padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12.5px; background: var(--surface); color: var(--text); font-family: inherit; }
  .vv-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .payment-switch { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .payment-switch__option { border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 12px 6px; text-align: center; cursor: pointer; background: var(--canvas); font-size: 20px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .payment-switch__option span { font-size: 10.5px; font-weight: 700; color: var(--text-soft); }
  .payment-switch__option.is-selected { border-color: var(--gold-deep); background: var(--gold-soft); }
  .payment-switch__option.is-selected span { color: var(--gold-deep); }
  .remaining-amount { color: #B02A2A; font-weight: 800; }

  .table-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; margin-bottom: 14px; }
  .search-wrap { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 12px; width: 280px; }
  .search-wrap svg { width: 14px; height: 14px; color: var(--text-faint); flex-shrink: 0; }
  .search-wrap input { border: none; outline: none; width: 100%; background: transparent; font-size: 12.5px; }
  .filter-chip { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-soft); cursor: pointer; background: var(--canvas); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px; }

  .ledger-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); }
  table.acc-table { width: 100%; border-collapse: collapse; min-width: 1100px; font-size: 12.5px; }
  .acc-table thead th { text-align: left; font-size: 10.5px; color: var(--text-faint); font-weight: 700; padding: 11px 12px; border-bottom: 1px solid var(--border); background: var(--canvas); white-space: nowrap; }
  .acc-table tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .acc-table tbody tr:last-child td { border-bottom: none; }
  .acc-table .num { font-variant-numeric: tabular-nums; font-weight: 600; }
  .amount-in { color: var(--emerald); }
  .cell-primary { font-weight: 700; color: var(--text); }

  .row-action-btn { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-soft); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .row-action-btn.is-danger { color: #B02A2A; }
  .row-action-btn svg { width: 12px; height: 12px; }
  .row-actions { display: flex; align-items: center; gap: 6px; }

  .btn { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; border-radius: var(--radius-sm); padding: 9px 16px; border: 1px solid transparent; cursor: pointer; }
  .btn--primary { background: var(--gold); color: var(--ink); }
  .btn--ghost { background: var(--surface); color: var(--text-soft); border-color: var(--border); }

  .dept-tag { font-size: 10px; font-weight: 800; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
  .dept-tag--flight { background: #DCFCE7; color: #1F9D6E; }
  .dept-tag--visa { background: #FBEFDA; color: #C98A1E; }
  .dept-tag--hotel { background: #FCE4F1; color: #D1499A; }
  .dept-row--flight { border-right: 4px solid #1F9D6E; background: #F0FBF6; }
  .dept-row--visa { border-right: 4px solid #C98A1E; background: #FEFAF0; }
  .dept-row--hotel { border-right: 4px solid #D1499A; background: #FDF0F7; }
  .btn-review { background: var(--emerald-soft); color: var(--emerald); border: 1px solid var(--emerald); font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap; }
  .btn-review:hover { background: var(--emerald); color: #fff; }

  .top-metrics-grid { display: grid; grid-template-columns: 240px 240px 1fr; gap: 16px; margin-bottom: 26px; }
  .metric-card { background: var(--ink); color: #fff; border-radius: var(--radius-lg); padding: 18px; display: flex; flex-direction: column; justify-content: center; }
  .metric-card__label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-on-ink-soft, #9CA3AF); margin-bottom: 8px; }
  .metric-card__value { font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--gold); }
  .metric-card__sub { font-size: 11px; color: var(--text-on-ink-soft, #9CA3AF); margin-top: 4px; }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 16px; }
  .chart-card__canvas-wrap { position: relative; height: 320px; }

  .section-title { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 14px; }
  .section-title h2 { font-family: var(--font-display); font-weight: 700; font-size: 15.5px; }
  .section-title p { font-size: 11px; color: var(--text-faint); margin-top: 2px; }

  .empty-state { text-align: center; padding: 36px 20px; color: var(--text-faint); }
  .empty-state p { font-size: 12px; }

  .dept-analysis-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 24px; margin-bottom: 32px; border-top: 4px solid var(--gold); }
  .dept-analysis-card:nth-of-type(1) { border-top-color: #1F9D6E; }
  .dept-analysis-card:nth-of-type(2) { border-top-color: #D1499A; }
  .dept-analysis-card:nth-of-type(3) { border-top-color: #C98A1E; }
  .dept-analysis-card + .dept-analysis-card { margin-top: 8px; }
  .dept-analysis-card__header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .dept-analysis-card__title { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
  .dept-analysis-card__chart-wrap { position: relative; height: 260px; margin-bottom: 18px; }
  .supplier-eye-btn { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-soft); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .supplier-eye-btn svg { width: 13px; height: 13px; }

  .vv-modal--small { max-width: 900px !important; }

  .page-header { margin-bottom: 24px; }
  .page-header h1 { font-family: var(--font-display); font-weight: 700; font-size: 22px; }
  .page-header p { font-size: 13px; color: var(--text-soft); margin-top: 5px; }

  @media (max-width: 1100px) { .package-grid { grid-template-columns: 1fr; } .top-metrics-grid { grid-template-columns: 1fr; } }
  .history-panel-overlay { position: fixed; inset: 0; background: rgba(15, 26, 48, 0.35); z-index: 90; display: none; }
  .history-panel-overlay.is-open { display: block; }
  .history-panel { position: fixed; top: 0; bottom: 0; inset-inline-end: 0; width: 420px; max-width: 92vw; background: var(--surface); box-shadow: var(--shadow-lg); z-index: 91; transform: translateX(105%); transition: transform 0.22s ease; display: flex; flex-direction: column; }
  [dir="rtl"] .history-panel { transform: translateX(-105%); }
  .history-panel-overlay.is-open .history-panel { transform: translateX(0); }
  .history-panel__header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .history-panel__title { font-weight: 700; font-size: 15px; }
  .history-panel__code { font-size: 11.5px; color: var(--text-faint); font-family: monospace; margin-top: 2px; }
  .history-panel__close { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-soft); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .history-panel__body { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .history-item { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .history-item__dept { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--gold-deep); background: var(--gold-soft); display: inline-block; padding: 2px 8px; border-radius: 20px; margin-bottom: 6px; }
  .history-item__title { font-size: 12.5px; font-weight: 700; margin-bottom: 3px; }
  .history-item__meta { font-size: 11px; color: var(--text-faint); }
  .history-empty { text-align: center; padding: 40px 20px; color: var(--text-faint); font-size: 12.5px; }

  .analysis-kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .analysis-kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 18px 20px; }
  .analysis-kpi-card__label { font-size: 11.5px; color: var(--text-soft); font-weight: 600; margin-bottom: 6px; }
  .analysis-kpi-card__value { font-family: var(--font-display); font-weight: 800; font-size: 20px; color: var(--text); }
  .analysis-kpi-card__value--danger { color: #B02A2A; }
  .analysis-kpi-card__badge { font-size: 11px; font-weight: 700; color: var(--gold-deep); background: var(--gold-soft); display: inline-block; padding: 3px 9px; border-radius: 20px; margin-top: 8px; }
  .analysis-chart-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px; }
  .analysis-chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 20px; margin-bottom: 16px; }
  .analysis-chart-card__title { font-family: var(--font-display); font-weight: 700; font-size: 14px; margin-bottom: 14px; }
  .analysis-chart-card__canvas-wrap { position: relative; height: 300px; }
  @media (max-width: 1100px) { .analysis-kpi-grid { grid-template-columns: repeat(2, 1fr); } .analysis-chart-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="app-shell">
  <div id="app-sidebar"></div>

  <div class="main">
    <div id="app-topbar"></div>

    <div class="content">

      <div id="dashboard-main-view">
        <div class="page-header">
          <h1>Data</h1>
          <p>B2B and B2C customer records, and consolidated sales reporting</p>
        </div>

        <div class="package-grid">
          <button class="package-card package-card--b2b" id="pkg-b2b" type="button">
            <div class="package-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21V6a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v15"/><path d="M14 10h6a1 1 0 0 1 1 1v10"/><path d="M3 21h18"/></svg></div>
            <div class="package-card__title">B2B</div>
            <div class="package-card__desc">Company accounts and their employees under a shared code</div>
          </button>

          <button class="package-card package-card--b2c" id="pkg-b2c" type="button">
            <div class="package-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M15 20a4.5 4.5 0 0 1 8 0"/></svg></div>
            <div class="package-card__title">B2C</div>
            <div class="package-card__desc">Individual customers and their families under a shared code</div>
          </button>

          <button class="package-card package-card--accounting" id="pkg-accounting" type="button" style="display:none;">
            <div class="package-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg></div>
            <div class="package-card__title">Data Analysis</div>
            <div class="package-card__desc">Revenue, profit, outstanding receivables, and supplier performance</div>
          </button>
        </div>
      </div>

      <div id="module-detail-view" style="display:none;"></div>

    </div>
  </div>
</div>

<div class="vv-modal-overlay" id="modal-payment-status">
  <div class="vv-modal" style="max-width:480px;">
    <div class="vv-modal__header">
      <div class="vv-modal__title">Payment Collection Status</div>
      <button class="vv-modal__close" data-close-modal="modal-payment-status" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="vv-modal__body">
      <input type="hidden" id="ps-booking-id" value="" />
      <div id="ps-summary-line" style="font-size:12.5px; color:var(--text-soft); margin-bottom:16px; background:var(--canvas); border-radius:var(--radius-sm); padding:10px 12px;"></div>

      <div class="payment-switch">
        <button type="button" class="payment-switch__option" data-payment-status="cash">Cash</button>
        <button type="button" class="payment-switch__option" data-payment-status="bank">Bank</button>
        <button type="button" class="payment-switch__option" data-payment-status="unpaid">Unpaid</button>
        <button type="button" class="payment-switch__option" data-payment-status="partial">Partial</button>
      </div>

      <div class="vv-field" id="ps-partial-field" style="display:none; margin-top:14px;">
        <label>Amount actually paid</label>
        <input type="number" min="0" step="0.01" id="ps-partial-amount" value="0" />
        <div id="ps-remaining-preview" style="margin-top:8px; font-size:13px; font-weight:800;"></div>
      </div>
    </div>
    <div class="vv-modal__footer">
      <button class="btn btn--ghost" data-close-modal="modal-payment-status" type="button">Cancel</button>
      <button class="btn btn--primary" id="btn-confirm-payment-status" type="button">Confirm Review</button>
    </div>
  </div>
</div>

<div class="vv-modal-overlay" id="modal-supplier-detail">
  <div class="vv-modal vv-modal--small">
    <div class="vv-modal__header">
      <div class="vv-modal__title" id="supplier-detail-title">Supplier Sales Report</div>
      <button class="vv-modal__close" data-close-modal="modal-supplier-detail" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="vv-modal__body" id="supplier-detail-body" style="max-height:70vh; overflow-y:auto;"></div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (typeof VVComponents !== "undefined") {
      VVComponents.mount({ page: "data", title: "Data" });
    }
  });
</script>
<script src="/client/modules/master_data/data.js"></script>
<!-- ============================= CUSTOMER HISTORY PANEL ============================= -->
<div class="history-panel-overlay" id="history-panel-overlay">
  <div class="history-panel">
    <div class="history-panel__header">
      <div>
        <div class="history-panel__title" id="history-panel-name">-</div>
        <div class="history-panel__code" id="history-panel-code">-</div>
      </div>
      <button class="history-panel__close" id="history-panel-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="history-panel__body" id="history-panel-body"></div>
  </div>
</div>

</body>
</html>
