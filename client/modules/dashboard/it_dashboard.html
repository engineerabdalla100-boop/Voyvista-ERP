<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IT Administration | Voyvista ERP</title>
<script src="/client/assets/js/config.js"></script>
<script src="/client/assets/js/api_client.js"></script>
<script src="/client/assets/js/auth.js"></script>
<script src="/client/assets/js/components.js"></script>
<script src="/client/assets/js/router.js"></script>
<link rel="stylesheet" href="/client/assets/css/style.css" />
<style>
  .it-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 1100px; margin: 30px 0 0; }
  .it-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 24px; display: flex; flex-direction: column; gap: 12px; text-align: left; cursor: pointer; transition: transform 0.18s ease, border-color 0.18s ease; position: relative; }
  .it-card:hover { transform: translateY(-3px); border-color: var(--gold); }
  .it-card__icon { width: 46px; height: 46px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--canvas); color: var(--gold-deep); }
  .it-card__icon svg { width: 22px; height: 22px; }
  .it-card__title { font-family: var(--font-display); font-size: 15.5px; font-weight: 700; color: var(--text); }
  .it-card__desc { font-size: 12px; color: var(--text-soft); line-height: 1.6; }
  .it-card__cta { margin-top: auto; font-size: 12px; font-weight: 600; color: var(--gold-deep); display:flex; align-items: center; gap: 6px; }
  .it-card__cta svg { width: 12px; height: 12px; }

  .online-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--emerald); display: inline-block; margin-inline-end: 6px; }

  .vv-modal-overlay { position: fixed; inset: 0; background: rgba(15, 26, 48, 0.4); z-index: 80; display: none; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; }
  .vv-modal-overlay.is-open { display: flex; }
  .vv-modal { background: var(--surface); border-radius: var(--radius-lg); width: 100%; max-width: 920px; box-shadow: var(--shadow-lg); overflow: hidden; }
  .vv-modal__header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .vv-modal__title { font-family: var(--font-display); font-weight: 700; font-size: 15.5px; }
  .vv-modal__close { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-soft); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .vv-modal__body { padding: 20px; max-height: 75vh; overflow-y: auto; }

  .vv-field { margin-bottom: 14px; }
  .vv-field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-soft); margin-bottom: 6px; }
  .vv-field input, .vv-field select { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; color: var(--text); background: var(--surface); box-sizing: border-box; }
  .vv-field-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

  table.it-table { width: 100%; border-collapse: collapse; }
  .it-table th { text-align: left; font-size: 11.5px; color: var(--text-faint); padding: 8px; border-bottom: 1px solid var(--border); }
  .it-table td { padding: 10px 8px; font-size: 12.5px; border-bottom: 1px solid var(--border); }

  .status-badge { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
  .status-badge--approved { background: var(--emerald-soft); color: var(--emerald); }
  .status-badge--pending { background: var(--amber-soft); color: var(--amber); }

  .modules-access-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: var(--canvas); padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .modules-access-grid label { font-size: 12px; font-weight: 500; color: var(--text); display: flex; align-items: center; gap: 6px; cursor: pointer; }

  .row-action-btn { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-soft); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; margin-inline-start: 4px; }
  .row-action-btn.is-danger { color: #B02A2A; border-color: #F2C4C4; }
  .row-action-btn svg { width: 12px; height: 12px; }

  .btn { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; border-radius: var(--radius-sm); padding: 9px 16px; border: 1px solid transparent; cursor: pointer; }
  .btn--primary { background: var(--gold); color: var(--ink); }
  .btn--ghost { background: var(--surface); color: var(--text-soft); border-color: var(--border); }

  .empty-state { text-align: center; padding: 30px 20px; color: var(--text-faint); font-size: 12.5px; }
</style>
</head>
<body>

<div class="app-shell">
  <div id="app-sidebar"></div>

  <div class="main">
    <div id="app-topbar"></div>

    <div class="content">
      <div class="page-head">
        <div>
          <h1>IT Administration</h1>
          <p style="font-size:12.5px; color:var(--text-soft); margin-top:4px;">Employee accounts, module access, activity tracking, and system backup</p>
        </div>
      </div>

      <div class="it-grid">

        <button class="it-card" id="it-open-employees" type="button">
          <div class="it-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M15 20a4.5 4.5 0 0 1 8 0"/></svg></div>
          <div class="it-card__title">Employee Accounts &amp; Access</div>
          <div class="it-card__desc">Create accounts, set passwords, assign roles, and grant module access.</div>
          <div class="it-card__cta">Access <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
        </button>

        <button class="it-card" id="it-open-online" type="button">
          <div class="it-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div>
          <div class="it-card__title">Who's Online</div>
          <div class="it-card__desc">Employees active in the last 5 minutes.</div>
          <div class="it-card__cta">Access <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
        </button>

        <button class="it-card" id="it-open-activity" type="button">
          <div class="it-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
          <div class="it-card__title">Recent Activity</div>
          <div class="it-card__desc">Who created or last edited each booking, filterable by department and date.</div>
          <div class="it-card__cta">Access <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
        </button>

        <button class="it-card" id="it-open-backup" type="button">
          <div class="it-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></div>
          <div class="it-card__title">Full Database Backup</div>
          <div class="it-card__desc">Download a complete JSON export of every module's data.</div>
          <div class="it-card__cta">Access <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
        </button>

      </div>
    </div>
  </div>
</div>

<div class="vv-modal-overlay" id="modal-employees">
  <div class="vv-modal" style="max-width: 820px;">
    <div class="vv-modal__header">
      <div class="vv-modal__title">Employee Accounts &amp; Access Control</div>
      <button class="vv-modal__close" data-close-modal="modal-employees">&times;</button>
    </div>
    <div class="vv-modal__body">

      <form id="vv-it-user-form" style="background: var(--canvas); border: 1px solid var(--border); padding: 16px; border-radius: var(--radius-md); margin-bottom: 20px;">
        <h3 style="font-size: 13.5px; font-weight: 700; margin-bottom: 12px; color: var(--text);" id="it-form-title">Create Employee Account &amp; Set Permissions</h3>
        <input type="hidden" id="it-u-editing-id" value="" />

        <div class="vv-field-row">
          <div class="vv-field"><label>First Name</label><input type="text" id="it-u-firstname" placeholder="e.g. Mahmoud" required /></div>
          <div class="vv-field"><label>Last Name</label><input type="text" id="it-u-lastname" placeholder="e.g. Ali" /></div>
        </div>
        <div class="vv-field-row">
          <div class="vv-field"><label>Username</label><input type="text" id="it-u-username" placeholder="e.g. mahmoud.sales" required /></div>
          <div class="vv-field"><label>Email</label><input type="email" id="it-u-email" placeholder="mahmoud@voyvista.com" required /></div>
        </div>
        <div class="vv-field-row">
          <div class="vv-field"><label id="it-u-password-label">Password</label><input type="password" id="it-u-password" placeholder="Initial password" /></div>
          <div class="vv-field"><label>Role</label>
            <select id="it-u-role">
              <option value="OPERATIONS">Operations</option>
              <option value="SALES">Sales</option>
              <option value="ACCOUNTANT">Accountant</option>
              <option value="IT">IT</option>
              <option value="OWNER">Owner</option>
              <option value="ADMIN">Admin</option>
            </select>
          </div>
        </div>

        <div class="vv-field">
          <label>Allowed Sidebar Modules:</label>
          <div class="modules-access-grid">
            <label><input type="checkbox" value="flights" class="it-mod-chk"> Flights</label>
            <label><input type="checkbox" value="hotels" class="it-mod-chk"> Hotels</label>
            <label><input type="checkbox" value="visas" class="it-mod-chk"> Visas</label>
            <label><input type="checkbox" value="staff" class="it-mod-chk"> Staff</label>
            <label><input type="checkbox" value="guides" class="it-mod-chk"> Tour Guides</label>
            <label><input type="checkbox" value="cars" class="it-mod-chk"> Cars</label>
            <label><input type="checkbox" value="events" class="it-mod-chk"> Events</label>
            <label><input type="checkbox" value="sales" class="it-mod-chk"> Sales</label>
            <label><input type="checkbox" value="data" class="it-mod-chk"> Data</label>
            <label><input type="checkbox" value="owner" class="it-mod-chk"> Owner Panel</label>
            <label><input type="checkbox" value="it_dashboard" class="it-mod-chk"> IT Dashboard</label>
          </div>
        </div>

        <div style="display:flex; gap:10px;">
          <button type="submit" class="btn btn--primary" style="flex:1;" id="it-form-submit-btn">Save Account &amp; Grant Access</button>
          <button type="button" class="btn btn--ghost" id="it-form-cancel-btn" style="display:none;">Cancel Edit</button>
        </div>
      </form>

      <div id="it-employee-directory"></div>
    </div>
  </div>
</div>

<div class="vv-modal-overlay" id="modal-online">
  <div class="vv-modal" style="max-width: 560px;">
    <div class="vv-modal__header">
      <div class="vv-modal__title">Who's Online</div>
      <button class="vv-modal__close" data-close-modal="modal-online">&times;</button>
    </div>
    <div class="vv-modal__body" id="online-body"></div>
  </div>
</div>

<div class="vv-modal-overlay" id="modal-activity">
  <div class="vv-modal" style="max-width: 920px;">
    <div class="vv-modal__header">
      <div class="vv-modal__title">Recent Activity</div>
      <button class="vv-modal__close" data-close-modal="modal-activity">&times;</button>
    </div>
    <div class="vv-modal__body">
      <div style="display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;">
        <select id="activity-dept-filter" style="padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:12.5px;">
          <option value="">All Departments</option>
          <option value="flight">Flights</option>
          <option value="hotel">Hotels</option>
          <option value="visa">Visas</option>
        </select>
        <input type="date" id="activity-date-filter" style="padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:12.5px;" />
        <button class="btn btn--ghost" id="btn-clear-activity-filters" type="button" style="font-size:12px;">Clear Filters</button>
      </div>
      <div id="activity-body"></div>
    </div>
  </div>
</div>

<script src="/client/modules/dashboard/it.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    VVComponents.mount({ page: "it_dashboard", title: "IT Administration" });
  });
</script>
</body>
</html>
